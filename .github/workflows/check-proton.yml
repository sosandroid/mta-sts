name: check-mta-sts

on:
  schedule:
    - cron: "17 6 * * 1"     # chaque lundi à 06:17 UTC
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

permissions:
  contents: read

env:
  DOMAIN: havet.fr

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Récupérer la politique Proton
        run: curl -fsS --retry 3 https://mta-sts.protonmail.com/.well-known/mta-sts.txt -o proton.txt

      - name: Comparer les MX (copie locale vs Proton)
        run: |
          if ! diff <(grep '^mx:' proton.txt | tr -d '\r' | sort) \
                    <(grep '^mx:' .well-known/mta-sts.txt | tr -d '\r' | sort); then
            echo "::error::Les MX de Proton ont changé : mettez à jour mta-sts.txt ET l'id du TXT _mta-sts"
            exit 1
          fi

      - name: Vérifier la politique en ligne (HTTPS + certificat)
        run: |
          curl -fsS --retry 3 "https://mta-sts.${DOMAIN}/.well-known/mta-sts.txt" -o live.txt
          diff .well-known/mta-sts.txt live.txt || { echo "::error::Le fichier publié diffère du dépôt"; exit 1; }

      - name: Vérifier les enregistrements DNS
        run: |
          dig +short TXT "_mta-sts.${DOMAIN}"  | grep -q 'v=STSv1'    || { echo "::error::TXT _mta-sts absent"; exit 1; }
